name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python build and test dependencies
        run: python -m pip install --upgrade build pip -e '.[test]'

      - name: Run tests
        run: python -m pytest

      - name: Build Python distributions
        run: python -m build

      - name: Install documentation build dependencies
        run: sudo apt-get update && sudo apt-get install --yes pandoc

      - name: Build and validate man pages
        run: make -C docs check

  container-integration:
    name: Test Jihwija in containers
    permissions:
      contents: read
    uses: ./.github/workflows/test-jihwija-in-containers.yml

  release:
    name: Update release PR or publish release
    needs:
      - validate
      - container-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
