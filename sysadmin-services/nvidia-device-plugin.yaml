apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: sysadmin-system
spec:
  chart: nvidia-device-plugin
  repo: https://nvidia.github.io/k8s-device-plugin
  version: 0.19.3
  targetNamespace: nvidia-device-plugin
  createNamespace: true
  timeout: 10m
  backOffLimit: 20
  valuesContent: |-
    runtimeClassName: nvidia

    # The plugin's Tegra UUID is the literal value "tegra", but the NVIDIA
    # runtime's Jetson CSV mode accepts device indices (such as "0").
    deviceIDStrategy: index

    nodeSelector:
      # The cluster's NVIDIA GPUs are on ARM64 Jetson nodes. Keep the
      # device-plugin pods off AMD64 nodes that lack the NVIDIA runtime.
      kubernetes.io/arch: arm64

    nfd:
      enabled: true
      worker:
        config:
          sources:
            custom:
              # The chart's default affinity accepts this label. Tegra GPUs
              # are integrated devices, so the usual NVIDIA PCI label may
              # not exist on Jetson nodes.
              - name: NVIDIA GPU driver available
                labels:
                  nvidia.com/gpu.present: "true"
                matchAny:
                  - matchFeatures:
                      - feature: kernel.loadedmodule
                        matchExpressions:
                          nvidia: {op: Exists}
                  - matchFeatures:
                      - feature: kernel.enabledmodule
                        matchExpressions:
                          nvidia: {op: Exists}
                  - matchFeatures:
                      # Jetson Linux kernels built by this repository use the
                      # -tegra local-version suffix. The NVIDIA driver may be
                      # built in or exposed through a different module name.
                      - feature: kernel.version
                        matchExpressions:
                          full: {op: InRegexp, value: [".*-tegra.*"]}
