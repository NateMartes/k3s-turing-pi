apiVersion: v1
kind: Secret
metadata:
  name: harbor-admin-password
  namespace: sysadmin-system
  labels:
    app.kubernetes.io/part-of: sysadmin-system
type: Opaque
data:
  # Rendered by scripts/apply-sysadmin-services from sysadmin-env.
  HARBOR_ADMIN_PASSWORD: ${HARBOR_ADMIN_PASSWORD_B64}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: harbor
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: sysadmin-system
spec:
  chart: harbor
  repo: https://helm.goharbor.io
  version: 1.19.4
  targetNamespace: sysadmin-system
  createNamespace: false
  timeout: 30m
  backOffLimit: 20
  valuesContent: |-
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: auto
      ingress:
        hosts:
          # Rendered by scripts/apply-sysadmin-services from sysadmin-env.
          core: ${HARBOR_HOSTNAME}
        className: traefik
        annotations:
          ingress.kubernetes.io/ssl-redirect: "true"
          ingress.kubernetes.io/proxy-body-size: "0"
          traefik.ingress.kubernetes.io/router.tls: "true"

    # Rendered by scripts/apply-sysadmin-services from sysadmin-env.
    externalURL: https://${HARBOR_HOSTNAME}

    # Run schema migrations before upgrading the Harbor workloads so core does
    # not have to migrate the database while jobservice is trying to start.
    # scripts/apply-sysadmin-services waits for PostgreSQL before updating this
    # HelmChart because the upstream migration Job has no init-container hook.
    enableMigrateHelmHook: true

    existingSecretAdminPassword: harbor-admin-password
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 20Gi
        jobservice:
          jobLog:
            storageClass: local-path
            accessMode: ReadWriteOnce
            size: 1Gi
        database:
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 1Gi
        redis:
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 1Gi
        trivy:
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 5Gi

    # local-path volumes are ReadWriteOnce, so persistent workloads must stop
    # before their replacements start.
    updateStrategy:
      type: Recreate

    # Harbor 2.15 is scheduled only to the selected AMD64 sysadmin node.
    portal:
      nodeSelector: &harborNodeSelector
        sysadmin-services: "true"
        kubernetes.io/arch: amd64
    core:
      nodeSelector: *harborNodeSelector
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      initContainers:
        - name: wait-for-database
          image: docker.io/goharbor/harbor-db:v2.15.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until pg_isready --host=harbor-database --port=5432; do
                echo "Waiting for Harbor database"
                sleep 2
              done
    jobservice:
      nodeSelector: *harborNodeSelector
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      initContainers:
        - name: wait-for-core
          image: docker.io/goharbor/harbor-core:v2.15.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until curl --fail --silent http://harbor-core/api/v2.0/ping; do
                echo "Waiting for Harbor core"
                sleep 2
              done
    registry:
      nodeSelector: *harborNodeSelector
    trivy:
      nodeSelector: *harborNodeSelector
    database:
      internal:
        nodeSelector: *harborNodeSelector
        livenessProbe:
          initialDelaySeconds: 1200
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
          successThreshold: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
    redis:
      internal:
        nodeSelector: *harborNodeSelector
    exporter:
      nodeSelector: *harborNodeSelector
