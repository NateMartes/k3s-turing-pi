apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argo-workflows
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: sysadmin-system
spec:
  chart: argo-workflows
  repo: https://argoproj.github.io/argo-helm
  version: 2.0.16
  targetNamespace: sysadmin-system
  createNamespace: false
  timeout: 15m
  backOffLimit: 20
  valuesContent: |-
    crds:
      install: true
      keep: true
      full: true

    # Cluster-scoped mode allows one controller to process Workflows in each
    # user's namespace. Do not enable singleNamespace for this cluster.
    singleNamespace: false

    # User namespaces receive the repository-managed argo-workflow-runner
    # account and RBAC through the user provisioning scripts.
    workflow:
      serviceAccount:
        create: false
      rbac:
        create: false

    # Every user namespace has a ResourceQuota that requires CPU and memory
    # requests and limits on every container. Apply small defaults to Argo's
    # generated init and wait executor containers.
    executor:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    controller:
      # An empty list leaves the cluster-scoped controller watching every
      # namespace without creating a chart-owned runner in `default`.
      workflowNamespaces: []
      nodeSelector:
        sysadmin-services: "true"
      clusterWorkflowTemplates:
        enabled: true
      # trust-k3s-crets installs this merged system bundle on every Ready node.
      # Apply it to every generated workflow main container so the setting is
      # part of the Helm release and survives controller ConfigMap recreation.
      workflowDefaults:
        spec:
          podSpecPatch: |
            volumes:
            - name: k3s-sysadmin-ca-trust
              hostPath:
                path: /etc/ssl/certs/ca-certificates.crt
                type: File
            containers:
            - name: main
              volumeMounts:
              - name: k3s-sysadmin-ca-trust
                mountPath: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem
                readOnly: true
              env:
              - name: SSL_CERT_FILE
                value: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem
              - name: REQUESTS_CA_BUNDLE
                value: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem
              - name: CURL_CA_BUNDLE
                value: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem
              - name: GIT_SSL_CAINFO
                value: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem
              - name: NODE_EXTRA_CA_CERTS
                value: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem
              - name: AWS_CA_BUNDLE
                value: /etc/ssl/certs/k3s-sysadmin-ca-bundle.pem

    server:
      authModes:
        - client
      # Traefik terminates external TLS at the Ingress.
      secure: false
      servicePortName: http
      nodeSelector:
        sysadmin-services: "true"
      clusterWorkflowTemplates:
        enabled: true
        enableEditing: false
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - ${ARGO_HOSTNAME}
        paths:
          - /
        pathType: Prefix
        tls:
          - secretName: argo-workflows-server-tls
            hosts:
              - ${ARGO_HOSTNAME}

    extraObjects:
      - apiVersion: cert-manager.io/v1
        kind: Issuer
        metadata:
          name: argo-workflows-selfsigned
          namespace: sysadmin-system
          labels:
            app.kubernetes.io/part-of: sysadmin-system
        spec:
          selfSigned: {}
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: argo-workflows-server-tls
          namespace: sysadmin-system
          labels:
            app.kubernetes.io/part-of: sysadmin-system
        spec:
          secretName: argo-workflows-server-tls
          dnsNames:
            - ${ARGO_HOSTNAME}
          issuerRef:
            apiGroup: cert-manager.io
            kind: Issuer
            name: argo-workflows-selfsigned
