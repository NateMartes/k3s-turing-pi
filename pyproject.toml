[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jihwija"
version = "0.1.0"
description = "Conduct a native K3s and Ansible cluster"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.scripts]
jihwija = "jihwija.cli:main"

[tool.setuptools]
packages = ["jihwija"]
