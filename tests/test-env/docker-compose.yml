name: jihwija-test

x-node: &node
  image: jihwija-test-node:ubuntu24.04
  privileged: true
  cgroup: private
  command:
    - /bin/sh
    - -ec
    - |
      mount --make-rshared /
      install -d -m 700 /root/.ssh /home/ansible/.ssh
      install -m 600 /test-ssh/id_ed25519 /root/.ssh/id_ed25519
      install -m 644 /test-ssh/id_ed25519.pub /root/.ssh/id_ed25519.pub
      install -m 600 /test-ssh/id_ed25519.pub /root/.ssh/authorized_keys
      install -m 600 -o ansible -g ansible /test-ssh/id_ed25519.pub /home/ansible/.ssh/authorized_keys
      chown ansible:ansible /home/ansible/.ssh
      install -d -m 755 /etc/rancher/k3s/config.yaml.d
      cat <<'EOF' > /etc/rancher/k3s/config.yaml.d/99-eviction.yaml
      kubelet-arg+:
        - "eviction-hard=imagefs.available<2Gi,nodefs.available<2Gi"
        - "eviction-minimum-reclaim=imagefs.available=500Mi,nodefs.available=500Mi"
        - "image-gc-high-threshold=98"
        - "image-gc-low-threshold=95"
      EOF
      exec /sbin/init
  environment:
    container: docker
  tmpfs:
    - /run
    - /run/lock
  volumes:
    - test-ssh:/test-ssh:ro
    - /lib/modules:/lib/modules:ro
    - ../..:/workspace:ro
  depends_on:
    ssh-key:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "systemctl is-active --quiet ssh.service"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  stop_grace_period: 2m

services:
  ssh-key:
    build:
      context: .
      target: node
    image: jihwija-test-node:ubuntu24.04
    command: ["/usr/local/sbin/generate-test-ssh-key"]
    volumes:
      - test-ssh:/test-ssh
    networks:
      - cluster
    restart: "no"

  operator:
    build:
      context: .
      target: operator
    image: jihwija-test-operator:ubuntu24.04
    working_dir: /workspace/tests/test-env
    command:
      - /bin/sh
      - -ec
      - |
        install -d -m 700 /root/.ssh
        install -m 600 /test-ssh/id_ed25519 /root/.ssh/id_ed25519
        install -m 644 /test-ssh/id_ed25519.pub /root/.ssh/id_ed25519.pub
        exec sleep infinity
    volumes:
      - test-ssh:/test-ssh:ro
      - ../..:/workspace:ro
    networks:
      - cluster
    depends_on:
      controller:
        condition: service_healthy
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy

  controller:
    <<: *node
    hostname: test-controller
    ports:
      - "127.0.0.1:16443:6443"
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
    networks:
      cluster:
        ipv4_address: 172.31.42.10

  worker-1:
    <<: *node
    hostname: test-worker-1
    networks:
      cluster:
        ipv4_address: 172.31.42.11

  worker-2:
    <<: *node
    hostname: test-worker-2
    networks:
      cluster:
        ipv4_address: 172.31.42.12

networks:
  cluster:
    name: jihwija-test-lan
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.42.0/24
          gateway: 172.31.42.1

volumes:
  test-ssh:
    name: jihwija-test-ssh
