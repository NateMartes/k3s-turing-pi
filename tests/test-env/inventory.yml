all:
  vars:
    # This credential exists only inside the isolated test network.
    ansible_user: ansible
    ansible_password: jihwija-test
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no
    ansible_ssh_pipelining: true

    k3s_version: "v1.36.1+k3s1"
    k3s_lan_cidr: "172.31.42.0/24"
    k3s_cluster_cidr: "10.244.0.0/16"
    k3s_service_cidr: "10.43.0.0/16"
    k3s_resolv_conf: /etc/rancher/k3s/resolv.conf
    k3s_dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"
    k3s_flannel_iface: eth0
    # Docker commonly stores this container on OverlayFS, which cannot host a
    # second OverlayFS mount for K3s/containerd.
    k3s_snapshotter: native

    # Docker owns address assignment and routing for this test LAN.
    netplan_dhcp_apply: false
    netplan_dhcp_interface: ""
    netplan_dhcp_definition: ""
    default_gateway_lan_cidr: "172.31.42.0/24"
    default_gateway_lan_interface: eth0
    default_gateway_wan_interface: eth0

  children:
    controller:
      hosts:
        test-controller:
          ansible_host: 172.31.42.10
          k3s_host: true
          is_default_gateway: true
          is_jihwija_service_node: true

    workers:
      hosts:
        test-worker-1:
          ansible_host: 172.31.42.11
        test-worker-2:
          ansible_host: 172.31.42.12
