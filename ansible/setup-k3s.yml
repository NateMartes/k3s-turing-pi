---
# Install K3s in a cluster
# Note: ensure that at least one node has k3s_host=true
# inside of inventory.yml.

- name: Classify K3s nodes
  hosts: all
  gather_facts: true

  tasks:
    - name: Determine the node IP used by K3s
      ansible.builtin.set_fact:
        k3s_node_ip: >-
          {{ ansible_host | default(ansible_default_ipv4.address, true) }}

    - name: Validate K3s network ranges and node addresses
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress
            import sys

            lan = ipaddress.ip_network(sys.argv[1], strict=False)
            pods = ipaddress.ip_network(sys.argv[2], strict=False)
            services = ipaddress.ip_network(sys.argv[3], strict=False)
            node = ipaddress.ip_address(sys.argv[4])
            errors = []

            if lan.overlaps(pods):
                errors.append(f"LAN {lan} overlaps Pod network {pods}")
            if lan.overlaps(services):
                errors.append(f"LAN {lan} overlaps Service network {services}")
            if pods.overlaps(services):
                errors.append(f"Pod network {pods} overlaps Service network {services}")
            if node not in lan:
                errors.append(f"node IP {node} is not in LAN {lan}")

            if errors:
                raise SystemExit("; ".join(errors))
          - "{{ k3s_lan_cidr }}"
          - "{{ k3s_cluster_cidr }}"
          - "{{ k3s_service_cidr }}"
          - "{{ k3s_node_ip }}"
      changed_when: false

    - name: Read the IPv4 addresses on the Flannel interface
      ansible.builtin.command:
        argv:
          - ip
          - -4
          - -o
          - address
          - show
          - dev
          - "{{ k3s_flannel_iface }}"
      register: k3s_flannel_interface_addresses
      changed_when: false

    - name: Verify the K3s node IP is assigned to the Flannel interface
      ansible.builtin.assert:
        that:
          - (' ' ~ k3s_node_ip ~ '/') in k3s_flannel_interface_addresses.stdout
        fail_msg: >-
          K3s node IP {{ k3s_node_ip }} is not assigned to
          {{ k3s_flannel_iface }}.

    - name: Add node to server or agent group
      ansible.builtin.group_by:
        key: "k3s_{{ 'server' if (k3s_host | default(false) | bool) else 'agent' }}"

    - name: Ensure exactly one K3s server exists
      ansible.builtin.assert:
        that:
          - groups.get('k3s_server', []) | length == 1
        fail_msg: >
          Exactly one node must have k3s_host: true.
        success_msg: >
          K3s server: {{ groups['k3s_server'][0] }}
      run_once: true

- name: Install K3s server
  hosts: k3s_server
  become: true

  tasks:
    - name: Check for existing K3s server state
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: k3s_existing_server_state

    - name: Check for existing K3s configuration
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_existing_server_config_file

    - name: Read existing K3s configuration
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: k3s_existing_server_config_raw
      when: k3s_existing_server_config_file.stat.exists

    - name: Parse existing K3s configuration
      ansible.builtin.set_fact:
        k3s_existing_server_config: >-
          {{ k3s_existing_server_config_raw.content | b64decode | from_yaml }}
      when: k3s_existing_server_config_file.stat.exists

    - name: Refuse an in-place cluster network migration
      ansible.builtin.assert:
        that:
          - >-
            not k3s_existing_server_state.stat.exists or
            (
              k3s_existing_server_config_file.stat.exists and
              (k3s_existing_server_config | default({})).get('cluster-cidr', '10.42.0.0/16') == k3s_cluster_cidr and
              (k3s_existing_server_config | default({})).get('service-cidr', '10.43.0.0/16') == k3s_service_cidr
            )
        fail_msg: >-
          This server contains an existing K3s cluster configured with different
          network CIDRs. Back up required data, run remove-k3s.yml, and then run
          setup-k3s.yml. Changing cluster-cidr in place is not supported.

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          node-name: "{{ inventory_hostname }}"
          node-ip: "{{ k3s_node_ip }}"
          flannel-iface: "{{ k3s_flannel_iface }}"
          cluster-cidr: "{{ k3s_cluster_cidr }}"
          service-cidr: "{{ k3s_service_cidr }}"
      notify: Restart K3s server

    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Check currently installed K3s version
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s --version
      register: k3s_current_version
      changed_when: false
      failed_when: false

    - name: Check for K3s server service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_server_service

    - name: Install K3s server
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "server"
      when: >
        not k3s_server_service.stat.exists or
        k3s_version not in (k3s_current_version.stdout | default(''))
      notify: Restart K3s server

    - name: Enable and start K3s server
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply any pending K3s restart
      ansible.builtin.meta: flush_handlers

    - name: Wait for K3s API server
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

    - name: Read K3s cluster token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file
      no_log: true

    - name: Store K3s cluster token
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"
      no_log: true

    - name: Label K3s server node as sysadmin-services
      ansible.builtin.command:
        cmd: >
          k3s kubectl label node
          {{ inventory_hostname }}
          sysadmin-services=true
          --overwrite

  handlers:
    - name: Restart K3s server
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true


- name: Install K3s agents
  hosts: k3s_agent
  become: true

  vars:
    k3s_server_name: "{{ groups['k3s_server'][0] }}"

    k3s_server_address: >-
      {{
        hostvars[k3s_server_name].k3s_server_address
        | default(
            hostvars[k3s_server_name].ansible_host
            | default(hostvars[k3s_server_name].ansible_default_ipv4.address)
          )
      }}

  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s agent
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          server: "https://{{ k3s_server_address }}:6443"
          token: "{{ hostvars[k3s_server_name].k3s_token }}"
          node-name: "{{ inventory_hostname }}"
          node-ip: "{{ k3s_node_ip }}"
          flannel-iface: "{{ k3s_flannel_iface }}"
      no_log: true
      notify: Restart K3s agent

    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Check currently installed K3s version
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s --version
      register: k3s_current_version
      changed_when: false
      failed_when: false

    - name: Check for K3s agent service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-agent.service
      register: k3s_agent_service

    - name: Install K3s agent
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "agent"
      when: >
        not k3s_agent_service.stat.exists or
        k3s_version not in (k3s_current_version.stdout | default(''))
      notify: Restart K3s agent

    - name: Enable and start K3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply any pending K3s agent restart
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart K3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted
        daemon_reload: true


- name: Verify K3s cluster
  hosts: k3s_server
  become: true

  tasks:
    - name: Wait for all nodes to register
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: registered_nodes
      changed_when: false
      until: registered_nodes.stdout_lines | length >= groups['all'] | length
      retries: 20
      delay: 3

    - name: Wait for all nodes to become ready
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/k3s kubectl wait
          --for=condition=Ready
          nodes
          --all
          --timeout=180s
      changed_when: false

    - name: Read node Pod CIDR assignments
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - nodes
          - -o
          - 'jsonpath={range .items[*]}{.metadata.name}{"="}{.spec.podCIDR}{"\n"}{end}'
      register: k3s_node_pod_cidrs
      changed_when: false

    - name: Verify node Pod CIDRs use the configured Pod network
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress
            import sys

            cluster = ipaddress.ip_network(sys.argv[1], strict=False)
            errors = []

            for line in sys.argv[2].splitlines():
                name, _, value = line.partition("=")
                if not value:
                    errors.append(f"{name} has no Pod CIDR")
                    continue
                pod_cidr = ipaddress.ip_network(value, strict=False)
                if not pod_cidr.subnet_of(cluster):
                    errors.append(f"{name} has Pod CIDR {pod_cidr}, outside {cluster}")

            if errors:
                raise SystemExit("; ".join(errors))
          - "{{ k3s_cluster_cidr }}"
          - "{{ k3s_node_pod_cidrs.stdout }}"
      changed_when: false

    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false

    - name: Show cluster
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
