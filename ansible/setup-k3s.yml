---
# Install K3s in a cluster
# Note: ensure that at least one node has k3s_host=true
# inside of inventory.yml.

- name: Classify K3s nodes
  hosts: all
  gather_facts: true

  tasks:
    - name: Add node to server or agent group
      ansible.builtin.group_by:
        key: "k3s_{{ 'server' if (k3s_host | default(false) | bool) else 'agent' }}"

    - name: Ensure exactly one K3s server exists
      ansible.builtin.assert:
        that:
          - groups.get('k3s_server', []) | length == 1
        fail_msg: >
          Exactly one node must have k3s_host: true.
        success_msg: >
          K3s server: {{ groups['k3s_server'][0] }}
      run_once: true

- name: Install K3s server
  hosts: k3s_server
  become: true

  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          node-name: "{{ inventory_hostname }}"
      notify: Restart K3s server

    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Check currently installed K3s version
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s --version
      register: k3s_current_version
      changed_when: false
      failed_when: false

    - name: Check for K3s server service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_server_service

    - name: Install K3s server
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "server"
      when: >
        not k3s_server_service.stat.exists or
        k3s_version not in (k3s_current_version.stdout | default(''))
      notify: Restart K3s server

    - name: Enable and start K3s server
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply any pending K3s restart
      ansible.builtin.meta: flush_handlers

    - name: Wait for K3s API server
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

    - name: Read K3s cluster token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file
      no_log: true

    - name: Store K3s cluster token
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"
      no_log: true

    - name: Label K3s server node as sysadmin-services
      ansible.builtin.command:
        cmd: >
          k3s kubectl label node
          {{ inventory_hostname }}
          sysadmin-services=true
          --overwrite

  handlers:
    - name: Restart K3s server
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true


- name: Install K3s agents
  hosts: k3s_agent
  become: true

  vars:
    k3s_server_name: "{{ groups['k3s_server'][0] }}"

    k3s_server_address: >-
      {{
        hostvars[k3s_server_name].k3s_server_address
        | default(
            hostvars[k3s_server_name].ansible_host
            | default(hostvars[k3s_server_name].ansible_default_ipv4.address)
          )
      }}

  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s agent
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          server: "https://{{ k3s_server_address }}:6443"
          token: "{{ hostvars[k3s_server_name].k3s_token }}"
          node-name: "{{ inventory_hostname }}"
      no_log: true
      notify: Restart K3s agent

    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Check currently installed K3s version
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s --version
      register: k3s_current_version
      changed_when: false
      failed_when: false

    - name: Check for K3s agent service
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-agent.service
      register: k3s_agent_service

    - name: Install K3s agent
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "agent"
      when: >
        not k3s_agent_service.stat.exists or
        k3s_version not in (k3s_current_version.stdout | default(''))
      notify: Restart K3s agent

    - name: Enable and start K3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply any pending K3s agent restart
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart K3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted
        daemon_reload: true


- name: Verify K3s cluster
  hosts: k3s_server
  become: true

  tasks:
    - name: Wait for all nodes to register
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: registered_nodes
      changed_when: false
      until: registered_nodes.stdout_lines | length >= groups['all'] | length
      retries: 20
      delay: 3

    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false

    - name: Show cluster
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
