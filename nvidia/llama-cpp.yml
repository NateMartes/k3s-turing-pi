# A GPU-backed llama.cpp server with its built-in web UI.
#
# Apply with:
#   sudo kubectl apply -f nvidia/llama-cpp.yml
#
# K3s ServiceLB exposes port 8080 on cluster nodes where that port is free.
# From the LAN, open http://10.42.0.1:8080 to use the UI through gostop.
---
apiVersion: v1
kind: Namespace
metadata:
  name: llama-cpp
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models
  namespace: llama-cpp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
    spec:
      runtimeClassName: nvidia
      initContainers:
        - name: download-model
          image: ghcr.io/ggml-org/llama.cpp:full-cuda-b12124
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              model=/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
              expected=74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db

              if [ -f "$model" ] && echo "$expected  $model" | sha256sum -c -; then
                exit 0
              fi

              rm -f "$model.tmp"
              curl --fail --location --retry 5 --retry-all-errors \
                --output "$model.tmp" \
                https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
              echo "$expected  $model.tmp" | sha256sum -c -
              mv "$model.tmp" "$model"
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:full-cuda-b12124
          imagePullPolicy: IfNotPresent
          command:
            - /app/llama-server
          args:
            - --model
            - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - --n-gpu-layers
            - "99"
            - --parallel
            - "1"
            - --metrics
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: llama-cpp
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
